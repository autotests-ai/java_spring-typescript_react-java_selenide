<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack — Multistack</title>
  <link rel="stylesheet" href="/stack/css/tokens.css">
  <link rel="stylesheet" href="/stack/css/link.css">
  <link rel="stylesheet" href="/stack/css/badge.css">
  <link rel="stylesheet" href="/stack/css/panel.css">
  <link rel="stylesheet" href="/stack/css/icon.css">
  <link rel="stylesheet" href="/stack/css/icon-btn.css">
  <link rel="stylesheet" href="/stack/css/lang-toggle.css">
  <link rel="stylesheet" href="/stack/css/poll-toggle.css">
  <link rel="stylesheet" href="/stack/css/header.css">
  <link rel="stylesheet" href="/stack/css/page.css">
  <link rel="stylesheet" href="/stack/css/stack-page.css">
</head>
<body>
  <div id="app-header"></div>
  <script src="/stack/js/app-base.js"></script>
  <script>
    window.headerConfig = {
      brand: { href: appPath('/'), label: 'Reference' },
      nav: [
        { href: appPath('/'), label: 'Home', testid: 'header-nav-home' },
        { href: appPath('/login'), label: 'Login', testid: 'header-nav-login' },
        { href: appPath('/register'), label: 'Register', testid: 'header-nav-register' },
        { href: '/stack/', label: 'Stack', active: true, testid: 'header-nav-stack' },
      ],
      lang: { default: 'en' },
      theme: { default: 'dark' },
    };
  </script>
  <script type="module" src="/stack/js/header.js"></script>

  <main class="page-shell page-shell--below-header stack-page" data-testid="stack-page">
    <div class="stack-page__error" id="stack-err" hidden></div>
    <div id="stack-root"></div>
  </main>
  <script type="module">
    import { bootStackPage } from '/stack/js/stack-matrix.js';
    bootStackPage(document.getElementById('stack-root'), {
      errEl: document.getElementById('stack-err'),
    });
  </script>
</body>
</html>
