# Local stand gateway — same-origin / + /api/ for SPA at document root (port 9911).
# Prod path shape lives in deploy/nginx/generated/autotests.ai-stack-*.conf.

server {
    listen 80;
    server_name _;

    # Docker embedded DNS, re-resolved per request. A static `upstream` block pins the container
    # IP at gateway startup, so every frontend rebuild leaves this proxy answering 502 until the
    # gateway itself is recreated. Resolving through a variable keeps the stand usable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        set $api_mock_upstream "api-mock:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_mock_upstream;
    }

    # WireMock admin — lets the mock e2e slice toggle scenario states (error injection).
    # Local teaching stand only; the prod vhost has no such route.
    location /__admin/ {
        set $api_mock_upstream "api-mock:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://$api_mock_upstream;
    }

    location / {
        set $frontend_upstream "frontend-typescript-react:80";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$frontend_upstream;
    }
}
