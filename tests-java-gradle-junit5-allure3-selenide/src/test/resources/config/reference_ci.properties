# reference_ci — the compose stack on this machine (same one GitHub Actions brings up).
# ./gradlew test -Denv=reference_ci -DincludeTags=harness
# ./gradlew test -Denv=reference_ci -DincludeTags=api
# ./gradlew test -Denv=reference_ci -DincludeTags=e2e -DexcludeTags=screenshot
# Spring+PG integration lives in BACKEND_DIR: ./gradlew test -DincludeTags=integration
#
# Prerequisite: docker compose up -d (starts stand-gateway-ci too).
# UI + /api same-origin via stand-gateway-ci :9821 — the frontend container itself (:9811)
# is a static SPA with no /api route; the gateway mirrors the prod path shape.
# Watch a run locally: -Dheadless=false   HAR in Allure: -DenableHar=true -DattachHarLogs=true

# Target app — ci gateway (SPA at /, real backend at /api)
baseUrl=http://localhost:9821/

# REST API — direct backend origin; tests append /api/... themselves
apiBaseUrl=http://localhost:8800/

# Browser configuration — local Chrome, no hub
browserSize=1920x1280
headless=true
